name: Build and validate contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install pinned modelspec and meaninggraph tools
        run: pnpm tools:install
      - run: pnpm generate
      - run: pnpm validate
      - run: pnpm lint:model
      - run: pnpm check:model-twin
      - run: pnpm check:meaning
      - run: pnpm check:schema
      - run: pnpm test:tools
      - name: Generated files are committed
        run: git diff --exit-code -- data-source/source.sqlite metadata model artifacts

  postgres-import:
    name: Verify PostgreSQL import
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: northwind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d northwind"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/northwind?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Generate pinned import SQL
        run: python3 scripts/hosting_imports.py
      - name: Import into disposable PostgreSQL service
        run: python3 scripts/import-postgres.py
      - name: Verify tables, keys, indexes, and complete view results
        run: python3 scripts/verify-hosting-imports.py --postgres
