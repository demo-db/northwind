name: Build and validate contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install pinned modelspec and meaninggraph tools
        run: pnpm tools:install
      - run: pnpm generate
      - run: pnpm validate
      - run: pnpm lint:model
      - run: pnpm check:model-twin
      - run: pnpm check:meaning
      - run: pnpm check:schema
      - run: pnpm test:tools
      - name: Generated files are committed
        run: git diff --exit-code -- data-source/source.sqlite metadata model artifacts
