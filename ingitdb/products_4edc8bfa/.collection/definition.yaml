record_file:
  name: records.json
  format: json
  type: "map[$record_id]map[$field_name]any"
primary_key: ["ProductID"]
columns:
  "ProductID":
    type: int
    required: true
  "ProductName":
    type: string
    required: true
  "SupplierID":
    type: int
  "CategoryID":
    type: int
  "QuantityPerUnit":
    type: string
  "UnitPrice":
    type: any
  "UnitsInStock":
    type: int
  "UnitsOnOrder":
    type: int
  "ReorderLevel":
    type: int
  "Discontinued":
    type: string
    required: true
