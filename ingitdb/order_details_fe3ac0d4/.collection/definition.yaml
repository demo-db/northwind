record_file:
  name: records.json
  format: json
  type: "map[$record_id]map[$field_name]any"
primary_key: ["OrderID","ProductID"]
columns:
  "OrderID":
    type: int
    required: true
  "ProductID":
    type: int
    required: true
  "UnitPrice":
    type: any
    required: true
  "Quantity":
    type: int
    required: true
  "Discount":
    type: float
    required: true
