{
  "format": "meaning/draft-1",
  "id": "northwind",
  "name": "Northwind",
  "description": "Semantic concepts for the Northwind sample business database.",
  "license": "CC0-1.0",
  "models": {
    "northwind": "northwind.modelspec.hcl"
  },
  "concepts": [
    {
      "id": "customer",
      "kind": "entity",
      "description": "A business that places Northwind orders.",
      "labels": {
        "en": "customer"
      },
      "extends": "meaning://github.com/meaninggraph/core/customer?ref=cb97dbcd9e951b00e7d46cb2e0c4e120c24c8db7",
      "bindings": [
        {
          "model": "modelspec:///northwind.Customers",
          "role": "entity"
        }
      ]
    },
    {
      "id": "employee",
      "kind": "entity",
      "description": "An employee who manages or processes orders.",
      "labels": {
        "en": "employee"
      },
      "extends": "meaning://github.com/meaninggraph/core/employee?ref=cb97dbcd9e951b00e7d46cb2e0c4e120c24c8db7",
      "bindings": [
        {
          "model": "modelspec:///northwind.Employees",
          "role": "entity"
        }
      ]
    },
    {
      "id": "order",
      "kind": "entity",
      "description": "A customer's purchase order recorded by Northwind.",
      "labels": {
        "en": "sales order"
      },
      "extends": "meaning://github.com/meaninggraph/core/invoice?ref=cb97dbcd9e951b00e7d46cb2e0c4e120c24c8db7",
      "bindings": [
        {
          "model": "modelspec:///northwind.Orders",
          "role": "entity"
        }
      ]
    },
    {
      "id": "order-line",
      "kind": "entity",
      "description": "A product and quantity included on an order.",
      "labels": {
        "en": "sales order line"
      },
      "extends": "meaning://github.com/meaninggraph/core/invoice-line?ref=cb97dbcd9e951b00e7d46cb2e0c4e120c24c8db7",
      "bindings": [
        {
          "model": "modelspec:///northwind.OrderDetails",
          "role": "entity"
        }
      ]
    },
    {
      "id": "shipping-country",
      "kind": "attribute",
      "description": "The country to which the order is shipped.",
      "labels": {
        "en": "shipping country"
      },
      "values-of": "meaning://github.com/meaninggraph/core/country?ref=cb97dbcd9e951b00e7d46cb2e0c4e120c24c8db7",
      "bindings": [
        {
          "model": "modelspec:///northwind.Orders",
          "property": "ShipCountry",
          "role": "value"
        }
      ]
    }
  ]
}
